services:
  war-room:
    build: .
    image: jev-civ6-war-room
    container_name: jev-war-room
    # Host networking (Docker Desktop setting "Enable host networking" —
    # already flipped in %APPDATA%\Docker\settings-store.json) lets the
    # in-process bridge reach Civ6's FireTuner on the Windows host's
    # 127.0.0.1:4318 DIRECTLY — no forwarder, no port mapping; the web UI
    # is simply at http://localhost:8081.
    network_mode: host
    environment:
      JEVCIV6_GAME_HOST: 127.0.0.1
      JEVCIV6_GAME_PORT: "4318"
      # API keys come from .env (gitignored) — never baked into the image.
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    volumes:
      # Whole-repo mount = hot code reload + journal/state/config persist
      # on the host. Dependencies stay in the image's /opt/venv.
      - .:/app
    restart: unless-stopped
